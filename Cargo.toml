[package]
name = "pristine-scope"
version = "0.2.0"
edition = "2021"
description = "Local, read-only PR scope & intent guardrail for fast-moving teams and AI agents"
authors = ["Ruslan Lapin"]
license = "MIT"
repository = "https://github.com/ruslanlap/pristine"
readme = "README.md"
keywords = ["git", "pull-request", "conventional-commits", "ci", "scope-check"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/**", ".specify/**", "specs/**"]

[[bin]]
name = "pristine"
path = "src/main.rs"

[dependencies]
